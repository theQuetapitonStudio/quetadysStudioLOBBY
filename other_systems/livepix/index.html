<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LivePix Overlay</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
    }

    body {
        font-family:
            Inter,
            "Segoe UI",
            Arial,
            sans-serif;

        pointer-events: none;
    }

    /* =====================================================
       CONTAINER
       ===================================================== */

    #overlay {
        position: fixed;

        right: 35px;
        bottom: 35px;

        width: 420px;

        display: flex;
        justify-content: flex-end;

        pointer-events: none;
    }

    /* =====================================================
       ALERT
       ===================================================== */

    .donation {
        position: relative;

        width: 100%;

        padding: 18px 20px;

        display: flex;
        align-items: center;
        gap: 15px;

        border-radius: 18px;

        background:
            linear-gradient(
                135deg,
                rgba(18, 18, 25, 0.94),
                rgba(28, 28, 40, 0.94)
            );

        border: 1px solid rgba(255,255,255,0.12);

        box-shadow:
            0 12px 40px rgba(0,0,0,0.35),
            0 0 35px rgba(120,90,255,0.15);

        color: white;

        transform:
            translateX(470px)
            scale(0.96);

        opacity: 0;

        animation:
            donationIn 0.55s cubic-bezier(.2,.8,.2,1)
            forwards;

        overflow: hidden;
    }

    /* brilho passando pelo card */

    .donation::before {
        content: "";

        position: absolute;

        top: 0;
        left: -120%;

        width: 70%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.08),
                transparent
            );

        transform: skewX(-20deg);

        animation:
            shine 1.3s ease-out 0.2s forwards;
    }

    /* linha colorida */

    .donation::after {
        content: "";

        position: absolute;

        left: 0;
        top: 0;

        width: 4px;
        height: 100%;

        background:
            linear-gradient(
                180deg,
                #8b5cf6,
                #ec4899
            );
    }

    /* =====================================================
       ICON
       ===================================================== */

    .icon {
        position: relative;

        flex-shrink: 0;

        width: 54px;
        height: 54px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 15px;

        background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );

        box-shadow:
            0 0 25px rgba(139,92,246,0.35);

        font-size: 25px;

        animation:
            iconPop 0.55s cubic-bezier(.2,1.5,.4,1)
            0.1s both;
    }

    /* =====================================================
       TEXT
       ===================================================== */

    .content {
        min-width: 0;
        flex: 1;
    }

    .title {
        font-size: 12px;

        font-weight: 700;

        letter-spacing: 1.5px;

        text-transform: uppercase;

        color: rgba(255,255,255,0.55);

        margin-bottom: 4px;
    }

    .name {
        max-width: 280px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

        font-size: 21px;

        line-height: 1.2;

        font-weight: 800;

        color: white;
    }

    .amount {
        margin-top: 4px;

        font-size: 16px;

        font-weight: 700;

        color: #c4b5fd;
    }

    /* =====================================================
       COIN
       ===================================================== */

    .coin {
        flex-shrink: 0;

        padding: 7px 10px;

        border-radius: 9px;

        background: rgba(255,255,255,0.07);

        border: 1px solid rgba(255,255,255,0.08);

        color: rgba(255,255,255,0.75);

        font-size: 11px;

        font-weight: 800;

        letter-spacing: 0.8px;
    }

    /* =====================================================
       ANIMATIONS
       ===================================================== */

    @keyframes donationIn {

        from {
            transform:
                translateX(470px)
                scale(0.96);

            opacity: 0;
        }

        to {
            transform:
                translateX(0)
                scale(1);

            opacity: 1;
        }
    }

    @keyframes iconPop {

        from {
            transform: scale(0.4) rotate(-15deg);

            opacity: 0;
        }

        to {
            transform: scale(1) rotate(0);

            opacity: 1;
        }
    }

    @keyframes shine {

        from {
            left: -120%;
        }

        to {
            left: 160%;
        }
    }

    @keyframes donationOut {

        from {
            transform:
                translateX(0)
                scale(1);

            opacity: 1;
        }

        to {
            transform:
                translateX(470px)
                scale(0.96);

            opacity: 0;
        }
    }

    .remove {
        animation:
            donationOut 0.45s
            cubic-bezier(.6,0,.8,.2)
            forwards;
    }
</style>
</head>

<body>

<div id="overlay"></div>

<script type="module">

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const SUPABASE_URL =
    "https://zfnpiizrgqaheoxqknqa.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_lPuF1lhinzneetMYWAR2yA_n8JXkrpq";

/*
    Tempo que o alerta permanece na tela.
    7000 = 7 segundos.
*/
const ALERT_TIME = 5000;


/* =========================================================
   SUPABASE REALTIME
   ========================================================= */

import {
    createClient
} from
"https://esm.sh/@supabase/supabase-js@2";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   ELEMENTO PRINCIPAL
   ========================================================= */

const overlay =
    document.getElementById("overlay");


/* =========================================================
   MOSTRAR DOAÇÃO
   ========================================================= */

function showDonation(data) {

    const name =
        String(
            data.name ||
            "ALGUÉM"
        );

    const amount =
        Number(data.amount || 0);

    const currency =
        String(
            data.currency ||
            "CRYPTO"
        ).toUpperCase();


    /*
        Cria o alerta.
    */

    const card =
        document.createElement("div");

    card.className =
        "donation";


    /*
        HTML do alerta.
    */

    card.innerHTML = `

        <div class="icon">
            💸
        </div>

        <div class="content">

            <div class="title">
                Nova doação
            </div>

            <div class="name">
                ${escapeHTML(name)}
            </div>

            <div class="amount">
                ${formatAmount(amount)}
                ${escapeHTML(currency)}
            </div>

        </div>

        <div class="coin">
            ${escapeHTML(currency)}
        </div>

    `;


    /*
        Coloca na tela.
    */

    overlay.appendChild(card);


    /*
        Remove depois de alguns segundos.
    */

    setTimeout(() => {

        card.classList.add(
            "remove"
        );

        setTimeout(() => {

            card.remove();

        }, 500);

    }, ALERT_TIME);

}


/* =========================================================
   FORMATAR VALOR
   ========================================================= */

function formatAmount(value) {

    if (!Number.isFinite(value)) {
        return "0";
    }

    return value.toLocaleString(
        "pt-BR",
        {
            maximumFractionDigits: 8
        }
    );
}


/* =========================================================
   SEGURANÇA BÁSICA PARA O NOME
   ========================================================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   REALTIME
   ========================================================= */

const channel =
    supabase
        .channel(
            "livepix-donations"
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",

                schema: "public",

                table: "donations"
            },

            (payload) => {

                console.log(
                    "💰 Nova doação:",
                    payload.new
                );

                /*
                    Só mostramos pagamentos
                    finalizados.
                */

                if (
                    payload.new.status ===
                    "finished"
                ) {

                    showDonation(
                        payload.new
                    );

                }

            }
        )
        .subscribe(
            (status) => {

                console.log(
                    "Realtime:",
                    status
                );

            }
        );
   globalThis.showDonation = showDonation;
</script>

</body>
</html>
